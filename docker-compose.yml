services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: neurorelatorio
      POSTGRES_USER: neuro
      POSTGRES_PASSWORD: neuro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: neuroadmin
      MINIO_ROOT_PASSWORD: neuroadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
